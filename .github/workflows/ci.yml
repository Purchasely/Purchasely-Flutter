name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Code Quality & Analysis
  # ============================================
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install dependencies (purchasely)
        working-directory: purchasely
        run: flutter pub get

      - name: Override purchasely_flutter dependency to local path
        run: |
          echo "dependency_overrides:" > purchasely_google/pubspec_overrides.yaml
          echo "  purchasely_flutter:" >> purchasely_google/pubspec_overrides.yaml
          echo "    path: ../purchasely" >> purchasely_google/pubspec_overrides.yaml

      - name: Install dependencies (purchasely_google)
        working-directory: purchasely_google
        run: flutter pub get

      - name: Install dependencies (purchasely_android_player)
        working-directory: purchasely_android_player
        run: flutter pub get

      - name: Check formatting (purchasely)
        working-directory: purchasely
        run: dart format --set-exit-if-changed .

      - name: Check formatting (purchasely_google)
        working-directory: purchasely_google
        run: dart format --set-exit-if-changed .

      - name: Check formatting (purchasely_android_player)
        working-directory: purchasely_android_player
        run: dart format --set-exit-if-changed .

      - name: Analyze (purchasely)
        working-directory: purchasely
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Analyze (purchasely_google)
        working-directory: purchasely_google
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Analyze (purchasely_android_player)
        working-directory: purchasely_android_player
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ============================================
  # Unit Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install dependencies (purchasely)
        working-directory: purchasely
        run: flutter pub get

      - name: Run tests (purchasely)
        working-directory: purchasely
        run: flutter test --coverage

      - name: Override purchasely_flutter dependency to local path
        run: |
          echo "dependency_overrides:" > purchasely_google/pubspec_overrides.yaml
          echo "  purchasely_flutter:" >> purchasely_google/pubspec_overrides.yaml
          echo "    path: ../purchasely" >> purchasely_google/pubspec_overrides.yaml

      - name: Install dependencies (purchasely_google)
        working-directory: purchasely_google
        run: flutter pub get

      - name: Run tests (purchasely_google)
        working-directory: purchasely_google
        run: flutter test --coverage

      - name: Install dependencies (purchasely_android_player)
        working-directory: purchasely_android_player
        run: flutter pub get

      - name: Run tests (purchasely_android_player)
        working-directory: purchasely_android_player
        run: flutter test --coverage

  # ============================================
  # Android Unit Tests (Kotlin/Java)
  # ============================================
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Setup Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter dependencies (purchasely)
        working-directory: purchasely
        run: flutter pub get

      - name: Build Android to generate gradle wrapper
        working-directory: purchasely/example
        run: flutter build apk --debug

      - name: Run Android unit tests (purchasely)
        working-directory: purchasely/example/android
        run: ./gradlew :purchasely_flutter:testDebugUnitTest --info

      - name: Upload test results (purchasely)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results-purchasely
          path: purchasely/example/android/build/purchasely_flutter/reports/tests/
          retention-days: 7

  # ============================================
  # iOS Unit Tests (Swift)
  # ============================================
  ios-unit-tests:
    name: iOS Unit Tests
    runs-on: macos-latest
    # Safety net: the RunnerTests host launches the Flutter engine; if it ever
    # stalls waiting on a VM-service connection, fail fast instead of burning the
    # job's full timeout.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Setup CocoaPods cache
        uses: actions/cache@v6
        with:
          path: purchasely/example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('purchasely/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Flutter dependencies
        working-directory: purchasely
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: purchasely/example/ios
        run: pod install --repo-update

      - name: Boot iOS Simulator
        id: boot-sim
        run: |
          # macos-latest ships no "iPhone 15,OS=latest" — resolve dynamically.
          UDID=$(xcrun simctl list devices available | \
            grep -E "iPhone (17|16|15|14)" | head -1 | \
            grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run iOS unit tests
        working-directory: purchasely/example/ios
        run: |
          # RunnerTests is a HOSTLESS logic-test bundle (no TEST_HOST — see the
          # Podfile/pbxproj), so `test` runs the XCTest cases WITHOUT launching
          # the full Flutter example app, which SIGSEGVs on headless CI sims.
          # `set -o pipefail` + no `|| true`: a real failure gates the job.
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "id=${{ steps.boot-sim.outputs.udid }}" \
            -only-testing:RunnerTests \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color --report junit --output test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: |
            purchasely/example/ios/TestResults.xcresult
            purchasely/example/ios/test-results.xml
          retention-days: 7

  # ============================================
  # iOS Build
  # ============================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Setup CocoaPods cache
        uses: actions/cache@v6
        with:
          path: purchasely/example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('purchasely/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        working-directory: purchasely
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: purchasely/example/ios
        run: pod install --repo-update

      - name: Build iOS (Debug - Simulator)
        working-directory: purchasely/example
        run: flutter build ios --debug --simulator --no-codesign

  # ============================================
  # iOS Swift Package Manager Build
  # ============================================
  build-ios-swiftpm:
    name: Build iOS (SwiftPM)
    runs-on: macos-latest
    needs: [analyze]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install dependencies
        working-directory: purchasely
        run: flutter pub get

      - name: Prepare SwiftPM example
        working-directory: purchasely/example/ios
        run: |
          pod deintegrate
          rm -rf Pods Podfile Podfile.lock
          sed -i '' '/Pods\/Target Support Files\/Pods-Runner\/Pods-Runner\..*\.xcconfig/d' Flutter/Debug.xcconfig Flutter/Release.xcconfig

      - name: Build iOS with SwiftPM (Debug - Simulator)
        working-directory: purchasely/example
        run: flutter build ios --debug --simulator --no-codesign

  # ============================================
  # Android Build
  # ============================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Setup Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies (purchasely)
        working-directory: purchasely
        run: flutter pub get

      - name: Build Android APK (Debug)
        working-directory: purchasely/example
        run: flutter build apk --debug

      - name: Build Android APK (Release)
        working-directory: purchasely/example
        run: flutter build apk --release

      - name: Build Android App Bundle (Release)
        working-directory: purchasely/example
        run: flutter build appbundle --release

  # ============================================
  # Flutter 3.44 / AGP 9 Compatibility
  # ============================================
  flutter-3-44-agp-9:
    name: Flutter 3.44 / AGP 9
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Install dependencies (purchasely)
        working-directory: purchasely
        run: flutter pub get

      - name: Install dependencies (purchasely_google)
        working-directory: purchasely_google
        run: flutter pub get

      - name: Install dependencies (purchasely_android_player)
        working-directory: purchasely_android_player
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --set-exit-if-changed purchasely
          dart format --set-exit-if-changed purchasely_google
          dart format --set-exit-if-changed purchasely_android_player

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings purchasely
          flutter analyze --no-fatal-infos --no-fatal-warnings purchasely_google
          flutter analyze --no-fatal-infos --no-fatal-warnings purchasely_android_player

      - name: Run tests
        run: |
          (cd purchasely && flutter test)
          (cd purchasely_google && flutter test)
          (cd purchasely_android_player && flutter test)

      - name: Build Android APK (Release)
        working-directory: purchasely/example
        run: flutter build apk --release

      - name: Build Android App Bundle (Release)
        working-directory: purchasely/example
        run: flutter build appbundle --release

      - name: Build Google extension Android release APK
        env:
          EXTENSION_PATH: purchasely_google
          PROJECT_NAME: purchasely_google_build
        run: |
          extension_app="$RUNNER_TEMP/$PROJECT_NAME"
          flutter create --platforms=android --project-name "$PROJECT_NAME" "$extension_app"
          # The generated app defaults to AGP 9 built-in Kotlin; the extension opts out
          # via KGP, so align the throwaway app to the same build model.
          printf '\nandroid.newDsl=false\nandroid.builtInKotlin=false\n' >> "$extension_app/android/gradle.properties"
          (
            cd "$extension_app"
            flutter pub add purchasely_google --path "$GITHUB_WORKSPACE/$EXTENSION_PATH"
            flutter build apk --release
          )

      - name: Build player extension Android release APK
        env:
          EXTENSION_PATH: purchasely_android_player
          PROJECT_NAME: purchasely_android_player_build
        run: |
          extension_app="$RUNNER_TEMP/$PROJECT_NAME"
          flutter create --platforms=android --project-name "$PROJECT_NAME" "$extension_app"
          # The generated app defaults to AGP 9 built-in Kotlin; the extension opts out
          # via KGP, so align the throwaway app to the same build model.
          printf '\nandroid.newDsl=false\nandroid.builtInKotlin=false\n' >> "$extension_app/android/gradle.properties"
          (
            cd "$extension_app"
            flutter pub add purchasely_android_player --path "$GITHUB_WORKSPACE/$EXTENSION_PATH"
            flutter build apk --release
          )

  # ============================================
  # Version Consistency Check
  # ============================================
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check version consistency
        run: |
          echo "Checking version consistency across packages..."

          # Extract versions from pubspec.yaml files
          PURCHASELY_VERSION=$(grep '^version:' purchasely/pubspec.yaml | awk '{print $2}')
          GOOGLE_VERSION=$(grep '^version:' purchasely_google/pubspec.yaml | awk '{print $2}')
          PLAYER_VERSION=$(grep '^version:' purchasely_android_player/pubspec.yaml | awk '{print $2}')

          echo "purchasely_flutter version: $PURCHASELY_VERSION"
          echo "purchasely_google version: $GOOGLE_VERSION"
          echo "purchasely_android_player version: $PLAYER_VERSION"

          # Check if main version is in VERSIONS.md
          if ! grep -q "| $PURCHASELY_VERSION" VERSIONS.md; then
            echo "::warning::Version $PURCHASELY_VERSION not found in VERSIONS.md"
          fi

          # Check if changelog has entry for current version
          if ! grep -q "## $PURCHASELY_VERSION" purchasely/CHANGELOG.md; then
            echo "::warning::Version $PURCHASELY_VERSION not found in CHANGELOG.md"
          fi

          echo "Version check completed!"

  # ============================================
  # Podspec Validation (iOS)
  # ============================================
  validate-podspec:
    name: Validate Podspec
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate podspec
        working-directory: purchasely/ios
        run: pod lib lint purchasely_flutter.podspec --allow-warnings || echo "::warning::Podspec validation had issues"

  # ============================================
  # Final Status Check
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        analyze,
        test,
        android-unit-tests,
        ios-unit-tests,
        build-ios,
        build-ios-swiftpm,
        build-android,
        flutter-3-44-agp-9,
        version-check,
      ]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.analyze.result }}" != "success" ]]; then
            echo "Analyze job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.android-unit-tests.result }}" != "success" ]]; then
            echo "Android unit tests job failed"
            exit 1
          fi
          if [[ "${{ needs.ios-unit-tests.result }}" != "success" ]]; then
            echo "iOS unit tests job failed"
            exit 1
          fi
          if [[ "${{ needs.build-ios.result }}" != "success" ]]; then
            echo "iOS build job failed"
            exit 1
          fi
          if [[ "${{ needs.build-ios-swiftpm.result }}" != "success" ]]; then
            echo "iOS SwiftPM build job failed"
            exit 1
          fi
          if [[ "${{ needs.build-android.result }}" != "success" ]]; then
            echo "Android build job failed"
            exit 1
          fi
          if [[ "${{ needs.flutter-3-44-agp-9.result }}" != "success" ]]; then
            echo "Flutter 3.44 / AGP 9 compatibility job failed"
            exit 1
          fi
          if [[ "${{ needs.version-check.result }}" != "success" ]]; then
            echo "Version check job failed"
            exit 1
          fi
          echo "All CI checks passed! ✅"
