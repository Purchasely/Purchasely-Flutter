plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "io.purchasely.sample"
    compileSdk = 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.purchasely.demo"
        // The purchasely_flutter plugin requires minSdk 23; flutter.minSdkVersion
        // varies by Flutter version (21 on 3.24, 24 on 3.41+), so pin explicitly.
        //
        // WARNING: `flutter build` runs a "Upgrading build.gradle" migration that
        // rewrites this line back to `minSdkVersion = flutter.minSdkVersion` every
        // time, silently. On Flutter 3.24.x that resolves to 21, below the
        // plugin's 23, and Android manifest merging then fails. If you built
        // locally, check `git diff` on this file before committing — and the
        // `Version Consistency` CI job asserts this exact line, so a clobber
        // fails the build instead of shipping.
        minSdk = 23
        targetSdk = 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// AGP 9 requires a unique namespace per library. integration_test pulls the legacy
// espresso 3.2.0 artifacts (espresso-core:3.2+), where espresso-core and
// espresso-idling-resource both declare `androidx.test.espresso`, which AGP 9 rejects
// during manifest merge. Force a modern espresso whose modules use distinct namespaces.
// See https://github.com/flutter/flutter/issues/56591
configurations.configureEach {
    resolutionStrategy {
        force 'androidx.test.espresso:espresso-core:3.6.1'
        force 'androidx.test.espresso:espresso-idling-resource:3.6.1'
    }
}

flutter {
    source '../..'
}

dependencies {
    // Pin to the same native SDK version as the plugin (purchasely/android/build.gradle).
    implementation 'io.purchasely:google-play:6.1.0'
    implementation 'io.purchasely:player:6.1.0'
}
