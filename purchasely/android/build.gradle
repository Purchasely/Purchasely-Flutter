group 'io.purchasely.purchasely_flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ ships built-in Kotlin, which is incompatible with the kotlin-android
// plugin. Only apply it on older AGP (e.g. integrator apps still on AGP 8).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'io.purchasely.purchasely_flutter'
    compileSdk = 36

    // AGP 9's built-in Kotlin defaults the Kotlin jvmTarget to 17 and no longer
    // derives it from targetCompatibility, so Java must target 17 too — otherwise
    // the build fails with "Inconsistent JVM-target between Java and Kotlin tasks".
    // AGP 9 already requires JDK 17+, so this raises no consumer floor.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 23
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'

    // Purchasely 6.0 native SDK — provides the builder/interceptAction/PLYPresentationBase
    // APIs wired by the single plugin (PurchaselyFlutterPlugin.kt), which compiles the
    // whole surface against this version.
    api 'io.purchasely:core:6.0.0-rc.3'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'io.mockk:mockk:1.14.11'
    testImplementation 'io.mockk:mockk-agent-jvm:1.14.11'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
